$kind: http-request
name: POST /auth — login
url: "{{baseUrl}}/auth"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "email": "natalia@example.com",
      "password": "123456"
    }
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: "const body = pm.response.json()\r

      if (body.accessToken) {\r

      \  pm.collectionVariables.set('accessToken', body.accessToken)\r

      \  console.log('accessToken salvo')\r

      }\r\n"
    language: text/javascript
order: 2000
